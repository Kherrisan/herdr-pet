[package]
name = "herdr-pet"
version = "0.4.0-beta.1"
description = "A desktop companion for Herdr agents"
authors = ["Herdr Pet contributors"]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"

[lib]
name = "herdr_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:dirs", "dep:interprocess", "dep:tauri", "dep:tauri-plugin-autostart", "dep:tauri-plugin-dialog", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-opener", "dep:tempfile", "dep:tracing", "dep:tracing-subscriber"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
dirs = { version = "6.0", optional = true }
interprocess = { version = "=2.4.2", features = ["tokio"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api"], optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tempfile = { version = "3.23", optional = true }
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
unicode-normalization = "0.1"

[dev-dependencies]
pretty_assertions = "1.4"
