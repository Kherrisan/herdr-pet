name: Build executables

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_args: ""
            artifact_name: herdr-pet-linux-x86_64
            executable_path: src-tauri/target/release/herdr-pet
          - os: windows-latest
            target_args: ""
            artifact_name: herdr-pet-windows-x86_64.exe
            executable_path: src-tauri/target/release/herdr-pet.exe
          - os: macos-latest
            target_args: "--target aarch64-apple-darwin"
            artifact_name: herdr-pet-macos-aarch64
            executable_path: src-tauri/target/aarch64-apple-darwin/release/herdr-pet
          - os: macos-latest
            target_args: "--target x86_64-apple-darwin"
            artifact_name: herdr-pet-macos-x86_64
            executable_path: src-tauri/target/x86_64-apple-darwin/release/herdr-pet
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      - run: npm test
      - run: npm run check:metadata
      - run: npm run check:visual-baseline
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - name: Build executable without an installer
        run: npm run tauri build -- --no-bundle ${{ matrix.target_args }}
      - name: Sign Windows executable when a certificate is configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host 'Windows signing certificate is not configured; keeping the executable unsigned.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'herdr-pet-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK signtool.exe was not found on the runner.' }
          & $signTool.FullName sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "${{ matrix.executable_path }}"
          if ($LASTEXITCODE -ne 0) { throw "signtool.exe failed with exit code $LASTEXITCODE." }
          $signature = Get-AuthenticodeSignature "${{ matrix.executable_path }}"
          if ($signature.Status -ne 'Valid') { throw "Windows signature verification failed: $($signature.Status)." }
      - name: Verify executable exists
        shell: bash
        run: test -f "${{ matrix.executable_path }}"
      - name: Stage uniquely named executable
        shell: bash
        run: cp "${{ matrix.executable_path }}" "${{ matrix.artifact_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download executable artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
